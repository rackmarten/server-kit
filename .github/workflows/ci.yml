name: CI

# Self-contained so it runs the same for anyone who forks the repo: GitHub-
# hosted runner, no reusable workflow from another repository.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks and the leak check scan history, not just the tree

      - name: Secret scan (gitleaks)
        # The gitleaks CLI rather than gitleaks/gitleaks-action, which needs a
        # license for organization repos.
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --source . --redact -v

      - name: Leak check
        # Private names must not reach this public repo. The patterns are the
        # org secret LEAK_PATTERNS, which fork PRs do not get: they pass with a
        # notice, and the push to main after merge runs the full check.
        env:
          LEAK_PATTERNS: ${{ secrets.LEAK_PATTERNS }}
          ENFORCE: ${{ github.repository_owner == 'rackmarten' && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
        run: |
          if [ -z "$LEAK_PATTERNS" ]; then
            if [ "$ENFORCE" = true ]; then
              echo "::error::LEAK_PATTERNS secret is not available"
              exit 1
            fi
            echo "::notice::LEAK_PATTERNS not available, leak check skipped"
            exit 0
          fi
          .github/scripts/leak-check.sh --tree --log

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Lint
        run: npm run lint
